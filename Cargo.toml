[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false
license = "MIT"

[workspace.dependencies]
my-browser-core = { path = "crates/core" }
engine-webkit = { path = "crates/engine-webkit" }
my-browser-mcp = { path = "crates/mcp" }
memtool = { path = "crates/memtool" }
my-browser-vault = { path = "crates/vault" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
adblock = { version = "0.13", default-features = false, features = ["content-blocking", "full-regex-handling"] }

# Argon2id di build debug tanpa optimasi butuh belasan detik per buka kunci.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
