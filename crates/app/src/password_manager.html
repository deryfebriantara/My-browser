<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --bg: #faf9f7; --surface: #ffffff; --text: #1f1e1d; --muted: #6f6b66; --line: #e7e3dd;
    --accent: #c96442; --accent-text: #ffffff; --danger: #b3261e; --soft: #f1eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1d; --surface: #2a2927; --text: #ecebe8; --muted: #a29d96; --line: #3a3835;
      --accent: #d97757; --accent-text: #1f1e1d; --danger: #f2b8b5; --soft: #33312e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  input, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: 0; }
  input:focus, textarea:focus { border-color: var(--accent); }
  #search { flex: 1; }
  button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: default; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.link { border: 0; background: none; padding: 3px 6px; color: var(--muted); }
  button.link:hover { color: var(--text); }
  main { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--muted); gap: 10px; }
  .center h2 { color: var(--text); margin: 0; font-size: 16px; }
  .center p { margin: 0; max-width: 360px; }
  .site { margin-top: 14px; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: none; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; }
  .row:hover { background: var(--soft); }
  .user, .secret { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .secret { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .secret.shown { color: var(--text); user-select: text; }
  .actions { display: flex; gap: 2px; }
  footer { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  footer .spacer { flex: 1; }
  #toast { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; text-align: center; }
  #toast.on { opacity: .95; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); width: 420px; padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.25); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  dialog input, dialog textarea { width: 100%; }
  .pw { display: flex; gap: 6px; }
  .pw input { flex: 1; font-family: ui-monospace, Menlo, monospace; }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .error { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <input id="search" type="search" placeholder="Search sites or usernames" autocomplete="off" spellcheck="false">
  <button id="add" class="primary">Add</button>
</header>
<main id="main"></main>
<footer>
  <button class="link" id="import">Import CSV…</button>
  <button class="link" id="export">Export CSV…</button>
  <button class="link" id="master">Change Master Password…</button>
  <span class="spacer"></span>
  <span id="count"></span>
  <button id="lock">Lock</button>
</footer>
<div id="toast"></div>

<dialog id="editor">
  <h3 id="editor-title">Add Password</h3>
  <label for="f-url">Website address</label>
  <input id="f-url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
  <label for="f-user">Username or email</label>
  <input id="f-user" autocomplete="off" spellcheck="false">
  <label for="f-pass">Password</label>
  <div class="pw">
    <input id="f-pass" type="password" autocomplete="new-password" spellcheck="false">
    <button id="f-show" type="button">Show</button>
    <button id="f-gen" type="button">Generate</button>
  </div>
  <label for="f-note">Note</label>
  <textarea id="f-note" rows="2"></textarea>
  <div class="error" id="f-error"></div>
  <div class="buttons">
    <button id="f-cancel" type="button">Cancel</button>
    <button id="f-save" class="primary" type="button">Save</button>
  </div>
</dialog>

<script>
(function () {
  var main = document.getElementById('main');
  var search = document.getElementById('search');
  var editor = document.getElementById('editor');
  var entries = null, editing = null, shownTimers = {};

  function post(o) { webkit.messageHandlers.mb.postMessage(JSON.stringify(o)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function button(label, cls, onclick, title) { var b = el('button', cls || 'link', label); b.onclick = onclick; if (title) b.title = title; return b; }

  var toastTimer;
  function toast(text) {
    var t = document.getElementById('toast'); t.textContent = text; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 3500);
  }

  function setLocked() {
    entries = null;
    Object.keys(shownTimers).forEach(function (k) { clearTimeout(shownTimers[k]); });
    shownTimers = {};
    if (editor.open) editor.close();
    document.getElementById('count').textContent = '';
    main.innerHTML = '';
    var c = el('div', 'center');
    c.appendChild(el('h2', null, 'Passwords Locked'));
    c.appendChild(el('p', null, 'Your saved passwords are encrypted. Unlock them with your master password to view and manage them.'));
    c.appendChild(button('Unlock', 'primary', function () { post({ t: 'unlock' }); }));
    main.appendChild(c);
  }

  function render() {
    if (!entries) return setLocked();
    var q = search.value.trim().toLowerCase();
    var list = entries.filter(function (e) { return !q || e.host.toLowerCase().indexOf(q) >= 0 || e.username.toLowerCase().indexOf(q) >= 0; });
    document.getElementById('count').textContent = entries.length + (entries.length === 1 ? ' password' : ' passwords');
    main.innerHTML = '';
    if (!entries.length) {
      var c = el('div', 'center');
      c.appendChild(el('h2', null, 'No Passwords Yet'));
      c.appendChild(el('p', null, 'Log in to a site as usual and choose Save, add a password manually, or import a CSV file from Chrome or the Passwords app.'));
      main.appendChild(c);
      return;
    }
    if (!list.length) { main.appendChild(el('div', 'center', 'No matches.')); return; }
    var lastHost = null;
    list.forEach(function (e) {
      if (e.host !== lastHost) { main.appendChild(el('div', 'site', e.host)); lastHost = e.host; }
      var row = el('div', 'row');
      row.appendChild(el('div', 'user', e.username || '(no username)'));
      var secret = el('div', 'secret', '••••••••••'); secret.id = 'secret-' + e.id;
      row.appendChild(secret);
      var actions = el('div', 'actions');
      actions.appendChild(button('Copy Username', 'link', function () { post({ t: 'copy_user', id: e.id }); }));
      actions.appendChild(button('Copy', 'link', function () { post({ t: 'copy', id: e.id }); }, 'Copy password (clipboard clears in 30 seconds)'));
      actions.appendChild(button('Show', 'link', function () { post({ t: 'reveal', id: e.id }); }));
      actions.appendChild(button('Edit', 'link', function () { openEditor(e); }));
      actions.appendChild(button('Delete', 'link danger', function () { post({ t: 'delete', id: e.id }); }));
      row.appendChild(actions);
      main.appendChild(row);
    });
  }

  function reveal(id, password) {
    var s = document.getElementById('secret-' + id);
    if (editing && editing.id === id) { document.getElementById('f-pass').value = password; return; }
    if (!s) return;
    s.textContent = password; s.classList.add('shown');
    clearTimeout(shownTimers[id]);
    shownTimers[id] = setTimeout(function () { s.textContent = '••••••••••'; s.classList.remove('shown'); delete shownTimers[id]; }, 20000);
  }

  function openEditor(entry) {
    editing = entry || null;
    document.getElementById('editor-title').textContent = entry ? 'Edit Password' : 'Add Password';
    document.getElementById('f-url').value = entry ? entry.origin : '';
    document.getElementById('f-url').disabled = !!entry;
    document.getElementById('f-user').value = entry ? entry.username : '';
    document.getElementById('f-pass').value = '';
    document.getElementById('f-pass').type = 'password';
    document.getElementById('f-pass').placeholder = entry ? 'Leave blank to keep the current password' : '';
    document.getElementById('f-note').value = entry ? entry.note : '';
    document.getElementById('f-error').textContent = '';
    editor.showModal();
    document.getElementById(entry ? 'f-user' : 'f-url').focus();
  }

  document.getElementById('f-show').onclick = function () {
    var f = document.getElementById('f-pass');
    if (f.type === 'password' && !f.value && editing) post({ t: 'reveal', id: editing.id });
    f.type = f.type === 'password' ? 'text' : 'password';
  };
  document.getElementById('f-gen').onclick = function () { post({ t: 'generate' }); };
  document.getElementById('f-cancel').onclick = function () { editor.close(); editing = null; };
  document.getElementById('f-save').onclick = function () {
    post({
      t: 'save',
      id: editing ? editing.id : null,
      url: document.getElementById('f-url').value,
      username: document.getElementById('f-user').value,
      password: document.getElementById('f-pass').value,
      note: document.getElementById('f-note').value,
    });
  };
  editor.addEventListener('close', function () { document.getElementById('f-pass').value = ''; editing = null; });

  document.getElementById('add').onclick = function () { if (entries) openEditor(null); else post({ t: 'unlock' }); };
  document.getElementById('import').onclick = function () { post({ t: 'import' }); };
  document.getElementById('export').onclick = function () { post({ t: 'export' }); };
  document.getElementById('master').onclick = function () { post({ t: 'change_master' }); };
  document.getElementById('lock').onclick = function () { post({ t: 'lock' }); };
  search.addEventListener('input', render);

  window.mbReceive = function (m) {
    if (m.t === 'locked') setLocked();
    else if (m.t === 'entries') { entries = m.entries; render(); }
    else if (m.t === 'secret') reveal(m.id, m.password);
    else if (m.t === 'generated') { var f = document.getElementById('f-pass'); f.value = m.password; f.type = 'text'; }
    else if (m.t === 'saved') { if (editor.open) editor.close(); toast(m.text); }
    else if (m.t === 'form_error') document.getElementById('f-error').textContent = m.text;
    else if (m.t === 'toast') toast(m.text);
  };
  post({ t: 'ready' });
})();
</script>
</body>
</html>
